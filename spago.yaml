package:
  name: functions
  dependencies:
    - prelude

  test:
    main: Test.Main
    dependencies:
      - effect
      - assert
      - console

workspace:
  backend:
    cmd: ../purust/bin/purust
    args: [--main, Test.Main, --source, output, --out, output/purust_output]
  packageSet:
    registry: 77.7.0
  extraPackages:
    prelude:
      path: "../purust-prelude"
    effect:
      path: "../purust-effect"
    assert:
      path: "../purust-assert"
    console:
      path: "../purust-console"
    safe-coerce:
      path: "../purust-safe-coerce"
